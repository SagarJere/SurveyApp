name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surveyapp
          POSTGRES_PASSWORD: surveyapp
          POSTGRES_DB: surveyapp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U surveyapp"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      JWT_SECRET: ci-only-secret-that-is-long-enough-0123456789
      DATABASE_URL: postgresql+asyncpg://surveyapp:surveyapp@localhost:5432/surveyapp_test
      TEST_DATABASE_URL: postgresql+asyncpg://surveyapp:surveyapp@localhost:5432/surveyapp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
