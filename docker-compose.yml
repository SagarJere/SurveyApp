name: survey-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-surveyapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surveyapp}
      POSTGRES_DB: ${POSTGRES_DB:-surveyapp}
      TZ: UTC
      PGTZ: UTC
    ports:
      # 127.0.0.1 only: the dev database is never exposed on the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
